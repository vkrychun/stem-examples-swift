name: Demo bug / setup issue
description: Something is broken in the demo projects or setup instructions.
title: "[Demo] "
labels: ["demo-bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template only for issues **in the demo projects themselves** — a demo that doesn't build, crashes on launch, renders wrong, or has a setup instruction that doesn't work.

        - **SDK bugs** (runtime errors, validator issues, rendering glitches that affect any StemJSON payload) → file at [vkrychun/stem-runtime-swift](https://github.com/vkrychun/stem-runtime-swift/issues).
        - **Spec questions** (does this JSON construct work as documented?) → file at [vkrychun/StemJSON](https://github.com/vkrychun/StemJSON/issues).
  - type: dropdown
    id: demo
    attributes:
      label: Which demo
      options:
        - StemQuickStart
        - StemHome
        - StemSwiftUI
        - StemUIKit
        - StemDependencies
        - StemJSON package
        - README / setup docs
        - Other
    validations:
      required: true
  - type: input
    id: xcode-version
    attributes:
      label: Xcode version
      placeholder: "26.0"
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version (simulator or device)
      placeholder: "18.0"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What's broken
      description: What you expected, what happens instead, and how to reproduce.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs / screenshots
    validations:
      required: false
